name: Docker

# Publishes ghcr.io/jacobalberty/lookmorelike: "edge" for every push to main,
# and X.Y.Z, X.Y and "latest" for a vX.Y.Z tag. Only code that passes CI is
# published.

on:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jacobalberty/lookmorelike

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/jacobalberty/LookMoreLike
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            node_auth_token=${{ secrets.NPM_GITHUB_TOKEN }}
