# Serves the built UI. Behind the reverse proxy, beenfar's own paths never
# reach this server (see compose.example.yaml), so it only has to answer for
# the app, its assets and its runtime configuration.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Written at container start from LOOKMORELIKE_API_BASE.
    location = /config.js {
        alias /tmp/lml/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lml-security-headers.conf;
    }

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lml-security-headers.conf;
    }

    # Built files have content hashes in their names: cache them for good.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/lml-security-headers.conf;
    }

    # Any other file (a favicon, a source map): served if it exists, a 404
    # if not. A missing .js must never come back as the app's HTML.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lml-security-headers.conf;
    }

    # The app's own routes (/networks, /devices/pending, ...) are client-side.
    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lml-security-headers.conf;
    }
}
